services:
  app:
    build: .
    restart: unless-stopped
    environment:
      HOST_PASSWORD: ${HOST_PASSWORD:?Set HOST_PASSWORD in the server configuration}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the HTTPS site URL}
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      ENDED_ROOM_RETENTION_HOURS: ${ENDED_ROOM_RETENTION_HOURS:-24}
    volumes:
      - rooms:/data
    ports:
      - "${WATCH_BIND_IP:-0.0.0.0}:80:80"
      - "${WATCH_BIND_IP:-0.0.0.0}:${WATCH_HTTPS_PORT:-443}:${WATCH_HTTPS_PORT:-443}"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: service:app
    depends_on:
      - app
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the HTTPS site URL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls:/data
      - caddy-config:/config

volumes:
  rooms:
    name: ${WATCH_DATA_VOLUME:-bili-watch-party-rooms}
  tls:
    name: ${WATCH_TLS_VOLUME:-bili-watch-party-tls}
  caddy-config:
