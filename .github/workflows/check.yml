name: Check pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check && npm test && npm run test:release
      - run: npm run build:web
        env:
          API_ORIGIN: https://api-watch.example.org
      - run: npm run test:release:compose
