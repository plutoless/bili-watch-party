<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>B 站一起看</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/xgplayer.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header><a href="/">B 站一起看</a><span>私密观影</span></header>

    <p id="startup" role="status">正在连接服务…</p>
    <section id="signin" class="panel form-panel" hidden>
      <h1>房主登录</h1>
      <form id="login-form">
        <label for="password">房主密码</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <p id="login-error" class="error" role="alert"></p>
        <button type="submit">登录</button>
      </form>
    </section>

    <section id="home" hidden>
      <section id="recent-room" class="panel form-panel" hidden>
        <h2>最近打开的房间</h2>
        <p id="recent-room-title"></p>
        <a id="continue-room" class="button-link">继续观影</a>
      </section>
      <section class="panel form-panel">
        <h1>创建观影房间</h1>
        <form id="source-form">
          <label for="source">B 站视频链接</label>
          <input id="source" type="url" inputmode="url" autocapitalize="off" spellcheck="false"
            required maxlength="2048" placeholder="https://www.bilibili.com/video/BV…"
            aria-describedby="source-help">
          <p id="source-help" class="hint">支持可公开播放的 BV 投稿，链接中的分 P 会一起导入。</p>
          <p id="source-error" class="error" role="alert"></p>
          <button type="submit">创建房间并导入</button>
        </form>
      </section>
    </section>

    <section id="room" class="panel room-panel" hidden>
      <div class="room-heading">
        <p id="status" role="status" data-status="queued"></p>
        <h1 id="title">观影房间</h1>
        <p id="source-detail" class="hint" hidden></p>
      </div>
      <p id="room-error" class="error" role="alert"></p>
      <button id="retry" type="button" hidden>重试导入</button>
      <p id="request-code" class="hint" hidden></p>
      <section id="host-tools" aria-label="访客邀请与审批" hidden>
        <p id="admission-status" role="status"></p>
        <ul id="join-requests" aria-label="加入申请"></ul>
        <div class="actions">
          <button id="share-invite" type="button" hidden>分享邀请</button>
          <button id="copy-invite" type="button" hidden>复制邀请</button>
          <button id="generate-invite" type="button" hidden>生成邀请</button>
        </div>
        <p id="action-message" class="hint" role="status"></p>
        <details id="room-management">
          <summary>管理房间</summary>
          <p id="invitation-status" class="hint"></p>
          <div id="invitation-link" hidden>
            <label for="invite-url">邀请链接</label>
            <input id="invite-url" type="text" readonly spellcheck="false">
          </div>
          <div class="actions">
            <button id="replace-invite" class="secondary" type="button" hidden>更换邀请</button>
            <button id="revoke-invite" class="secondary" type="button" hidden>撤销邀请</button>
            <button id="end-room" class="secondary" type="button">结束房间</button>
          </div>
        </details>
      </section>
      <div id="player" role="region" aria-label="房间播放器" hidden>
        <div class="player-screen">
          <video id="video" playsinline disablepictureinpicture disableremoteplayback preload="auto" tabindex="0"
            aria-label="房间视频"></video>
        </div>
        <div class="playback-controls">
          <div class="playback-toolbar">
            <p id="playback-time" class="hint" role="timer" aria-label="播放时间">--:-- / --:--</p>
            <button id="fullscreen" type="button" class="secondary" aria-pressed="false">网页全屏</button>
          </div>
          <p id="playback-status" role="status"></p>
          <div class="playback-meter" id="playback-progress" hidden>
            <label for="playhead">播放进度</label>
            <progress id="playhead" value="0" max="1"></progress>
          </div>
          <div class="playback-meter" id="playback-buffer" hidden>
            <label for="buffered">已缓冲</label>
            <meter id="buffered" min="0" max="100" value="0"></meter>
          </div>
          <div id="playback-actions">
            <ul class="readiness" aria-label="两端就绪状态">
              <li id="host-ready"></li>
              <li id="visitor-ready"></li>
            </ul>
            <div class="actions">
              <button id="prepare" type="button">准备好了</button>
              <button id="play" type="button" hidden>播放</button>
              <button id="end-after-playback" class="secondary" type="button" hidden>结束房间</button>
            </div>
            <div id="seek-controls" hidden>
              <label for="seek">跳转进度</label>
              <input id="seek" type="range" min="0" max="0" step="any" value="0" disabled>
            </div>
          </div>
          <p id="playback-message" class="error" role="status"></p>
          <p id="end-room-message" class="error" role="status"></p>
        </div>
      </div>
      <a id="back" class="back" href="/">返回首页</a>
    </section>
  </main>
</body>
</html>
